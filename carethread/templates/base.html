<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CareThread{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('dashboard') }}">Care<span>Thread</span></a>
    <span class="tagline">Pre-visit briefs for safety-net clinics</span>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>
    Synthetic patient data (Synthea). Every claim links to the record that produced it.
    {% block footer_note %}{% endblock %}
  </footer>
</body>
</html>
